<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>AURAE — Detail Shot</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: #faf6f0;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1412;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #d4a574;
  }
  /* Macro detail visual: large gold texture area */
  .detail-area {
    width: 700px; height: 700px;
    border-radius: 50%;
    background: linear-gradient(145deg, #e8dcc8 0%, #d4a574 30%, #c49464 50%, #d4a574 70%, #e8c49a 100%);
    position: relative;
    margin-bottom: 60px;
    box-shadow: 0 40px 100px rgba(26, 20, 18, 0.12);
    overflow: hidden;
  }
  /* Simulated chain texture with CSS */
  .chain-texture {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .chain-link {
    width: 80px; height: 40px;
    border: 4px solid rgba(250, 246, 240, 0.4);
    border-radius: 20px;
    position: absolute;
  }
  .chain-link:nth-child(1) { top: -80px; left: -120px; transform: rotate(-20deg); }
  .chain-link:nth-child(2) { top: -50px; left: -50px; transform: rotate(-10deg); }
  .chain-link:nth-child(3) { top: -20px; left: 20px; transform: rotate(0deg); }
  .chain-link:nth-child(4) { top: 10px; left: 90px; transform: rotate(10deg); }
  .chain-link:nth-child(5) { top: 40px; left: 160px; transform: rotate(20deg); }
  .chain-link:nth-child(6) { top: -110px; left: -50px; transform: rotate(-15deg); border-color: rgba(250,246,240,0.25); }
  .chain-link:nth-child(7) { top: 70px; left: -80px; transform: rotate(5deg); border-color: rgba(250,246,240,0.3); }
  /* Light reflection effects */
  .detail-area::before {
    content: '';
    position: absolute;
    top: 80px; left: 120px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    filter: blur(40px);
  }
  .detail-area::after {
    content: '';
    position: absolute;
    bottom: 100px; right: 100px;
    width: 150px; height: 150px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    filter: blur(30px);
  }
  /* Sparkle dots */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    background: white;
    border-radius: 50%;
  }
  .sparkle-1 { top: 200px; left: 250px; }
  .sparkle-2 { top: 350px; right: 200px; }
  .sparkle-3 { bottom: 250px; left: 300px; }
  .sparkle-4 { top: 280px; left: 400px; width: 8px; height: 8px; }
  .text-section {
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .craft-label {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #d4a574;
    margin-bottom: 18px;
  }
  .craft-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 58px;
    font-weight: 600;
    color: #1a1412;
    line-height: 1.15;
    margin-bottom: 18px;
  }
  .craft-heading em { color: #d4a574; font-style: italic; }
  .craft-desc {
    font-size: 20px;
    font-weight: 300;
    color: rgba(26, 20, 18, 0.5);
    max-width: 600px;
    line-height: 1.6;
    margin: 0 auto;
  }
  .bottom-line {
    position: absolute;
    bottom: 55px;
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, #d4a574, transparent);
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">AURAE</div>

  <div class="detail-area">
    <div class="chain-texture">
      <div class="chain-link"></div>
      <div class="chain-link"></div>
      <div class="chain-link"></div>
      <div class="chain-link"></div>
      <div class="chain-link"></div>
      <div class="chain-link"></div>
      <div class="chain-link"></div>
    </div>
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    <div class="sparkle sparkle-4"></div>
  </div>

  <div class="text-section">
    <div class="craft-label">The Details</div>
    <div class="craft-heading">Crafted with <em>Care</em></div>
    <div class="craft-desc">Every link is carefully designed for lasting beauty. Premium gold-plated finish that stands the test of time.</div>
  </div>

  <div class="bottom-line"></div>
</div>
</body>
</html>
