<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>AURAE — Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: #faf6f0;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1412;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px;
  }
  /* Gold accent lines */
  .post::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, transparent, #d4a574, transparent);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, transparent, #d4a574, transparent);
  }
  .brand-tag {
    position: absolute;
    top: 55px;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #d4a574;
  }
  /* Decorative corner frames */
  .corner {
    position: absolute;
    width: 100px; height: 100px;
  }
  .corner-tl { top: 80px; left: 80px; border-top: 1px solid #d4a574; border-left: 1px solid #d4a574; }
  .corner-tr { top: 80px; right: 80px; border-top: 1px solid #d4a574; border-right: 1px solid #d4a574; }
  .corner-bl { bottom: 80px; left: 80px; border-bottom: 1px solid #d4a574; border-left: 1px solid #d4a574; }
  .corner-br { bottom: 80px; right: 80px; border-bottom: 1px solid #d4a574; border-right: 1px solid #d4a574; }
  /* Decorative gold diamond */
  .diamond-deco {
    width: 16px; height: 16px;
    background: #d4a574;
    transform: rotate(45deg);
    margin-bottom: 50px;
    opacity: 0.5;
  }
  .quote-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 160px;
    color: rgba(212, 165, 116, 0.25);
    line-height: 0.5;
    margin-bottom: 30px;
  }
  .quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 54px;
    font-weight: 500;
    text-align: center;
    line-height: 1.4;
    color: #1a1412;
    max-width: 850px;
    position: relative;
    z-index: 1;
  }
  .quote-text em {
    color: #d4a574;
    font-style: italic;
    font-weight: 600;
  }
  .gold-line {
    width: 80px;
    height: 2px;
    background: #d4a574;
    margin: 45px 0 30px;
  }
  .attribution {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #d4a574;
  }
  /* Subtle radial glow behind quote */
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212, 165, 116, 0.06) 0%, transparent 70%);
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">AURAE</div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="glow"></div>

  <div class="diamond-deco"></div>
  <div class="quote-mark">&ldquo;</div>
  <div class="quote-text">
    Jewelry is like the perfect spice &mdash; it always <em>complements</em> what's already there
  </div>
  <div class="gold-line"></div>
  <div class="attribution">@aurae</div>
</div>
</body>
</html>
