<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>AURAE — Hero Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .ad {
    width: 1080px; height: 1350px;
    background: #faf8f0;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  /* Gold accent border */
  .border-frame {
    position: absolute; top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1px solid rgba(201,168,76,0.3);
  }
  .corner { position: absolute; width: 40px; height: 40px; }
  .corner::before, .corner::after {
    content: ''; position: absolute; background: #c9a84c;
  }
  .corner.tl { top: -1px; left: -1px; }
  .corner.tl::before { top: 0; left: 0; width: 40px; height: 2px; }
  .corner.tl::after { top: 0; left: 0; width: 2px; height: 40px; }
  .corner.tr { top: -1px; right: -1px; }
  .corner.tr::before { top: 0; right: 0; width: 40px; height: 2px; }
  .corner.tr::after { top: 0; right: 0; width: 2px; height: 40px; }
  .corner.bl { bottom: -1px; left: -1px; }
  .corner.bl::before { bottom: 0; left: 0; width: 40px; height: 2px; }
  .corner.bl::after { bottom: 0; left: 0; width: 2px; height: 40px; }
  .corner.br { bottom: -1px; right: -1px; }
  .corner.br::before { bottom: 0; right: 0; width: 40px; height: 2px; }
  .corner.br::after { bottom: 0; right: 0; width: 2px; height: 40px; }
  /* Gold decorative elements */
  .gold-ring {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(201,168,76,0.15);
  }
  .gr1 { width: 400px; height: 400px; top: -100px; right: -100px; }
  .gr2 { width: 300px; height: 300px; bottom: -50px; left: -50px; }
  .gr3 { width: 200px; height: 200px; top: 50%; left: 50%; transform: translate(-50%,-50%); border-color: rgba(201,168,76,0.08); }
  /* Jewelry silhouettes */
  .chain-line {
    position: absolute;
    width: 2px; background: linear-gradient(180deg, transparent, rgba(201,168,76,0.15), transparent);
  }
  .cl1 { right: 200px; top: 100px; height: 300px; }
  .cl2 { right: 250px; top: 150px; height: 250px; }
  .pendant {
    position: absolute; right: 210px; top: 400px;
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #c9a84c, #e8d48b);
    box-shadow: 0 4px 15px rgba(201,168,76,0.3);
  }
  .content {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    padding: 100px 80px;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600; letter-spacing: 8px;
    color: #c9a84c; margin-bottom: 100px;
  }
  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 82px; font-weight: 700; line-height: 1.05;
    color: #1a1a1a; margin-bottom: 36px;
  }
  .headline em {
    font-style: italic; color: #c9a84c;
  }
  .divider {
    width: 80px; height: 2px; background: #c9a84c;
    margin-bottom: 36px;
  }
  .subtext {
    font-size: 20px; color: #8a7a60; font-weight: 300;
    line-height: 1.8; max-width: 550px;
    margin-bottom: auto;
  }
  /* Category pills */
  .categories {
    display: flex; gap: 14px; margin-bottom: 56px;
    flex-wrap: wrap;
  }
  .cat-pill {
    border: 1px solid rgba(201,168,76,0.4);
    color: #8a7a60; font-size: 13px; font-weight: 500;
    padding: 10px 22px; border-radius: 30px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cta-btn {
    background: #1a1a1a; color: #faf8f0;
    font-size: 16px; font-weight: 600;
    padding: 20px 50px; border-radius: 0;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .price-note {
    text-align: right;
  }
  .from-text {
    font-size: 13px; color: #bba870; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px; font-weight: 700; color: #1a1a1a;
  }
  .shipping {
    font-size: 12px; color: #bba870; margin-top: 4px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="border-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
  <div class="gold-ring gr1"></div>
  <div class="gold-ring gr2"></div>
  <div class="gold-ring gr3"></div>
  <div class="chain-line cl1"></div>
  <div class="chain-line cl2"></div>
  <div class="pendant"></div>
  <div class="content">
    <div class="logo">AURAE</div>
    <h1 class="headline">Affordable<br>Luxury,<br><em>Effortless</em><br>Style</h1>
    <div class="divider"></div>
    <p class="subtext">
      18K gold-plated. Waterproof. Tarnish-free.<br>
      Designed for everyday elegance.
    </p>
    <div class="categories">
      <div class="cat-pill">Necklaces</div>
      <div class="cat-pill">Earrings</div>
      <div class="cat-pill">Rings</div>
      <div class="cat-pill">Bracelets</div>
    </div>
    <div class="bottom">
      <div class="cta-btn">Shop Collection</div>
      <div class="price-note">
        <div class="from-text">Starting from</div>
        <div class="price">$12</div>
        <div class="shipping">Free shipping on $35+</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
