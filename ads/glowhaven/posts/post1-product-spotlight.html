<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Product Spotlight</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(170deg, #fff5f7 0%, #fce4ec 40%, #f8b4c8 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /* Decorative circles */
  .post::before {
    content: '';
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.08);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.06);
  }
  .brand-tag {
    position: absolute;
    top: 60px; left: 0; right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e91e8c;
  }
  .product-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 80px;
  }
  .product-icon {
    width: 280px; height: 340px;
    background: linear-gradient(145deg, #ffffff 0%, #fce4ec 100%);
    border-radius: 30px;
    box-shadow: 0 30px 80px rgba(233, 30, 140, 0.15), 0 10px 30px rgba(233, 30, 140, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 50px;
    position: relative;
    border: 2px solid rgba(233, 30, 140, 0.12);
  }
  .product-icon .drop {
    width: 80px; height: 110px;
    background: linear-gradient(180deg, #e91e8c 0%, #c2185b 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    margin-bottom: 20px;
    position: relative;
  }
  .product-icon .drop::after {
    content: '';
    position: absolute;
    top: 18px; left: 18px;
    width: 20px; height: 25px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
  }
  .product-icon .bottle-label {
    font-size: 13px;
    font-weight: 500;
    color: #e91e8c;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .spotlight-tag {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e91e8c;
    margin-bottom: 20px;
  }
  .product-name {
    font-family: 'Playfair Display', serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.1;
    color: #1a1a1a;
    margin-bottom: 14px;
  }
  .product-sub {
    font-size: 22px;
    font-weight: 300;
    color: #4a3040;
    margin-bottom: 50px;
  }
  .benefits {
    display: flex;
    gap: 40px;
    margin-bottom: 50px;
  }
  .benefit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .benefit-circle {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 8px 25px rgba(233, 30, 140, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  .benefit span {
    font-size: 16px;
    font-weight: 500;
    color: #4a3040;
    letter-spacing: 1px;
  }
  .price {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    color: #e91e8c;
    margin-bottom: 40px;
  }
  .cta {
    background: #e91e8c;
    color: white;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 22px 70px;
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(233, 30, 140, 0.35);
  }
  .deco-dots {
    position: absolute;
    bottom: 50px;
    display: flex;
    gap: 10px;
  }
  .deco-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.25);
  }
  .deco-dots span:nth-child(1) { background: #e91e8c; }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">GLOWHAVEN</div>

  <div class="product-container">
    <div class="product-icon">
      <div class="drop"></div>
      <div class="bottle-label">Essence</div>
    </div>
    <div class="spotlight-tag">Product Spotlight</div>
    <div class="product-name">Snail Mucin<br>Essence</div>
    <div class="product-sub">Your skin's new best friend</div>

    <div class="benefits">
      <div class="benefit">
        <div class="benefit-circle">&#x2728;</div>
        <span>Hydration</span>
      </div>
      <div class="benefit">
        <div class="benefit-circle">&#x1F504;</div>
        <span>Repair</span>
      </div>
      <div class="benefit">
        <div class="benefit-circle">&#x2B50;</div>
        <span>Glow</span>
      </div>
    </div>

    <div class="price">$24.99</div>
    <div class="cta">Shop Now</div>
  </div>

  <div class="deco-dots">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>
</body>
</html>
