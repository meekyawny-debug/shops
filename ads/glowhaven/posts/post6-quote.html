<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Inspirational Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, #f8b4c8 0%, #fce4ec 40%, #fff5f7 70%, #fce4ec 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px;
  }
  /* Decorative circles */
  .deco-ring-1 {
    position: absolute;
    top: 100px; left: 80px;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 2px solid rgba(233, 30, 140, 0.12);
  }
  .deco-ring-2 {
    position: absolute;
    bottom: 120px; right: 100px;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px solid rgba(233, 30, 140, 0.1);
  }
  .deco-ring-3 {
    position: absolute;
    top: 300px; right: 60px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.06);
  }
  .deco-line-top {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: rgba(233, 30, 140, 0.25);
    border-radius: 2px;
  }
  .deco-line-bottom {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: rgba(233, 30, 140, 0.25);
    border-radius: 2px;
  }
  .brand-tag {
    position: absolute;
    top: 85px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e91e8c;
  }
  .quote-mark-open {
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    color: rgba(233, 30, 140, 0.2);
    line-height: 0.6;
    margin-bottom: 10px;
  }
  .quote-text {
    font-family: 'Playfair Display', serif;
    font-size: 60px;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    color: #1a1a1a;
    position: relative;
    z-index: 1;
    max-width: 880px;
  }
  .quote-text em {
    color: #e91e8c;
    font-style: italic;
  }
  .quote-mark-close {
    font-family: 'Playfair Display', serif;
    font-size: 180px;
    color: rgba(233, 30, 140, 0.2);
    line-height: 0.4;
    margin-top: 20px;
    align-self: flex-end;
    margin-right: 40px;
  }
  .divider {
    width: 60px;
    height: 3px;
    background: #e91e8c;
    border-radius: 2px;
    margin: 40px 0 25px;
  }
  .attribution {
    font-size: 18px;
    font-weight: 400;
    color: #4a3040;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .sparkle-1 {
    position: absolute;
    top: 220px; left: 150px;
    font-size: 28px;
    opacity: 0.4;
  }
  .sparkle-2 {
    position: absolute;
    bottom: 280px; right: 140px;
    font-size: 24px;
    opacity: 0.3;
  }
  .sparkle-3 {
    position: absolute;
    top: 380px; right: 200px;
    font-size: 20px;
    opacity: 0.25;
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">GLOWHAVEN</div>

  <div class="deco-ring-1"></div>
  <div class="deco-ring-2"></div>
  <div class="deco-ring-3"></div>
  <div class="deco-line-top"></div>
  <div class="deco-line-bottom"></div>
  <div class="sparkle-1">&#x2728;</div>
  <div class="sparkle-2">&#x2728;</div>
  <div class="sparkle-3">&#x2728;</div>

  <div class="quote-mark-open">&ldquo;</div>
  <div class="quote-text">
    Beautiful skin requires <em>commitment</em>, not a miracle
  </div>
  <div class="quote-mark-close">&rdquo;</div>

  <div class="divider"></div>
  <div class="attribution">@glowhaven</div>
</div>
</body>
</html>
