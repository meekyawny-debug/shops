<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Glass Skin Routine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(180deg, #fff5f7 0%, #fce4ec 50%, #f8b4c8 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1a1a;
    padding: 70px 80px;
    display: flex;
    flex-direction: column;
  }
  .post::before {
    content: '';
    position: absolute;
    top: 200px; right: -150px;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.06);
  }
  .brand-tag {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e91e8c;
    margin-bottom: 30px;
  }
  .heading {
    font-family: 'Playfair Display', serif;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.1;
    color: #1a1a1a;
    margin-bottom: 10px;
  }
  .heading em {
    color: #e91e8c;
    font-style: italic;
  }
  .subtitle {
    font-size: 20px;
    font-weight: 300;
    color: #4a3040;
    margin-bottom: 50px;
  }
  .steps {
    display: flex;
    flex-direction: column;
    gap: 24px;
    flex: 1;
    position: relative;
    z-index: 1;
  }
  .step {
    background: white;
    border-radius: 24px;
    padding: 34px 40px;
    display: flex;
    align-items: center;
    gap: 30px;
    box-shadow: 0 8px 30px rgba(233, 30, 140, 0.08);
    border: 1px solid rgba(233, 30, 140, 0.08);
  }
  .step-number {
    width: 72px; height: 72px;
    min-width: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e91e8c, #ff6bb5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: white;
  }
  .step-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .step-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 600;
    color: #1a1a1a;
  }
  .step-desc {
    font-size: 18px;
    font-weight: 300;
    color: #4a3040;
  }
  .step-icon {
    margin-left: auto;
    font-size: 36px;
    min-width: 50px;
    text-align: center;
  }
  .footer-line {
    position: absolute;
    bottom: 60px;
    left: 80px; right: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-line .tag {
    font-size: 15px;
    font-weight: 500;
    color: #e91e8c;
    letter-spacing: 2px;
  }
  .footer-line .divider {
    flex: 1;
    height: 1px;
    background: rgba(233, 30, 140, 0.2);
    margin: 0 20px;
  }
  .connector {
    position: absolute;
    left: 115px;
    width: 2px;
    background: rgba(233, 30, 140, 0.15);
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">GLOWHAVEN</div>
  <div class="heading">Your 4-Step<br><em>Glass Skin</em><br>Routine</div>
  <div class="subtitle">Unlock your dewiest skin ever</div>

  <div class="steps">
    <div class="step">
      <div class="step-number">1</div>
      <div class="step-content">
        <div class="step-title">Cleanse</div>
        <div class="step-desc">Double cleanse to remove impurities</div>
      </div>
      <div class="step-icon">&#x1F9FC;</div>
    </div>
    <div class="step">
      <div class="step-number">2</div>
      <div class="step-content">
        <div class="step-title">Tone</div>
        <div class="step-desc">Balance pH &amp; prep your skin</div>
      </div>
      <div class="step-icon">&#x1F4A7;</div>
    </div>
    <div class="step">
      <div class="step-number">3</div>
      <div class="step-content">
        <div class="step-title">Serum</div>
        <div class="step-desc">Snail mucin for deep hydration</div>
      </div>
      <div class="step-icon">&#x2728;</div>
    </div>
    <div class="step">
      <div class="step-number">4</div>
      <div class="step-content">
        <div class="step-title">SPF</div>
        <div class="step-desc">Protect that glow every day</div>
      </div>
      <div class="step-icon">&#x2600;&#xFE0F;</div>
    </div>
  </div>

  <div class="footer-line">
    <span class="tag">Save this routine</span>
    <span class="divider"></span>
    <span class="tag">@glowhaven</span>
  </div>
</div>
</body>
</html>
