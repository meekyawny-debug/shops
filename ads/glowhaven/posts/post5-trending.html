<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Trending in K-Beauty</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(170deg, #fff5f7 0%, #fce4ec 50%, #f8b4c8 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #1a1a1a;
    padding: 60px 70px;
    display: flex;
    flex-direction: column;
  }
  .post::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.07);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: -50px; left: -50px;
    width: 250px; height: 250px;
    border-radius: 50%;
    background: rgba(233, 30, 140, 0.05);
  }
  .brand-tag {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #e91e8c;
    margin-bottom: 25px;
  }
  .trending-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #e91e8c;
    color: white;
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    width: fit-content;
  }
  .heading {
    font-family: 'Playfair Display', serif;
    font-size: 58px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .heading em { color: #e91e8c; font-style: italic; }
  .subtitle {
    font-size: 20px;
    font-weight: 300;
    color: #4a3040;
    margin-bottom: 45px;
  }
  .products-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    flex: 1;
    position: relative;
    z-index: 1;
  }
  .product-card {
    background: white;
    border-radius: 24px;
    padding: 35px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 10px 35px rgba(233, 30, 140, 0.08);
    border: 1px solid rgba(233, 30, 140, 0.06);
    transition: transform 0.3s;
  }
  .product-visual {
    width: 120px; height: 120px;
    border-radius: 50%;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
  }
  .product-card:nth-child(1) .product-visual { background: linear-gradient(135deg, #fce4ec, #f8b4c8); }
  .product-card:nth-child(2) .product-visual { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); }
  .product-card:nth-child(3) .product-visual { background: linear-gradient(135deg, #e3f2fd, #bbdefb); }
  .product-card:nth-child(4) .product-visual { background: linear-gradient(135deg, #fff3e0, #ffe0b2); }
  .product-name {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #1a1a1a;
  }
  .product-desc {
    font-size: 14px;
    font-weight: 300;
    color: #4a3040;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .product-price {
    font-size: 24px;
    font-weight: 600;
    color: #e91e8c;
  }
  .fire-icon { font-size: 18px; }
  .footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 35px;
    font-size: 16px;
    color: #e91e8c;
    font-weight: 500;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">GLOWHAVEN</div>
  <div class="trending-badge"><span class="fire-icon">&#x1F525;</span> TRENDING NOW</div>
  <div class="heading">Trending in<br><em>K-Beauty</em></div>
  <div class="subtitle">The products everyone is obsessed with</div>

  <div class="products-grid">
    <div class="product-card">
      <div class="product-visual">&#x1F40C;</div>
      <div class="product-name">Snail Mucin Essence</div>
      <div class="product-desc">Deep hydration serum</div>
      <div class="product-price">$24.99</div>
    </div>
    <div class="product-card">
      <div class="product-visual">&#x1F33F;</div>
      <div class="product-name">Centella Ampoule</div>
      <div class="product-desc">Calming treatment</div>
      <div class="product-price">$18.99</div>
    </div>
    <div class="product-card">
      <div class="product-visual">&#x1F4A7;</div>
      <div class="product-name">Hyaluronic Toner</div>
      <div class="product-desc">7-layer hydration</div>
      <div class="product-price">$15.99</div>
    </div>
    <div class="product-card">
      <div class="product-visual">&#x2600;&#xFE0F;</div>
      <div class="product-name">Rice SPF 50+</div>
      <div class="product-desc">Invisible sun shield</div>
      <div class="product-price">$19.99</div>
    </div>
  </div>

  <div class="footer">Shop All Trending &#x2192;</div>
</div>
</body>
</html>
