<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Flash Sale</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, #e91e8c 0%, #c2185b 50%, #880e4f 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }
  /* Decorative background shapes */
  .post::before {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.04);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.03);
  }
  .bg-circle {
    position: absolute;
    top: 200px; left: 50%;
    transform: translateX(-50%);
    width: 700px; height: 700px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
  }
  .flash-badge {
    background: white;
    color: #e91e8c;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    padding: 16px 50px;
    border-radius: 50px;
    margin-bottom: 50px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }
  .sale-text {
    font-family: 'Playfair Display', serif;
    font-size: 120px;
    font-weight: 700;
    text-align: center;
    line-height: 1;
    margin-bottom: 10px;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }
  .sale-sub {
    font-size: 36px;
    font-weight: 300;
    text-align: center;
    margin-bottom: 50px;
    opacity: 0.9;
    letter-spacing: 4px;
    position: relative;
    z-index: 1;
  }
  .timer {
    display: flex;
    gap: 20px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .timer-block {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 25px 30px;
    text-align: center;
    min-width: 110px;
  }
  .timer-num {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 700;
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }
  .timer-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.8;
  }
  .code-section {
    text-align: center;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .code-label {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 12px;
  }
  .code {
    background: white;
    color: #e91e8c;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 8px;
    padding: 16px 50px;
    border-radius: 14px;
    display: inline-block;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
  }
  .cta {
    background: white;
    color: #e91e8c;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 24px 80px;
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }
  .corner-deco {
    position: absolute;
    width: 80px; height: 80px;
    border: 2px solid rgba(255, 255, 255, 0.1);
  }
  .corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
  .corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
  .corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">GLOWHAVEN</div>
  <div class="bg-circle"></div>
  <div class="corner-deco corner-tl"></div>
  <div class="corner-deco corner-tr"></div>
  <div class="corner-deco corner-bl"></div>
  <div class="corner-deco corner-br"></div>

  <div class="flash-badge">&#x26A1; FLASH SALE &#x26A1;</div>

  <div class="sale-text">20% OFF</div>
  <div class="sale-sub">E V E R Y T H I N G</div>

  <div class="timer">
    <div class="timer-block">
      <span class="timer-num">06</span>
      <span class="timer-label">Hours</span>
    </div>
    <div class="timer-block">
      <span class="timer-num">24</span>
      <span class="timer-label">Minutes</span>
    </div>
    <div class="timer-block">
      <span class="timer-num">59</span>
      <span class="timer-label">Seconds</span>
    </div>
  </div>

  <div class="code-section">
    <div class="code-label">Use code at checkout</div>
    <div class="code">GLOW20</div>
  </div>

  <div class="cta">Shop Now</div>
</div>
</body>
</html>
