<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Hero Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .ad {
    width: 1080px; height: 1350px;
    background: linear-gradient(145deg, #fff5f7 0%, #fce4ec 40%, #f8b4c8 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  /* Decorative circles */
  .circle1 {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(233,30,140,0.12) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .circle2 {
    position: absolute; width: 350px; height: 350px; border-radius: 50%;
    background: radial-gradient(circle, rgba(233,30,140,0.08) 0%, transparent 70%);
    bottom: 100px; left: -80px;
  }
  .circle3 {
    position: absolute; width: 200px; height: 200px; border-radius: 50%;
    border: 2px solid rgba(233,30,140,0.15);
    bottom: 300px; right: 80px;
  }
  /* Shimmer line */
  .shimmer {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #f8b4c8, #e91e8c, #f8b4c8);
  }
  /* Content */
  .content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: 100%; padding: 100px 70px;
  }
  .logo-area {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 80px;
  }
  .logo-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #e91e8c, #f8b4c8);
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 26px; height: 26px; fill: white; }
  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 600; letter-spacing: 4px;
    color: #1a1a1a;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 78px; font-weight: 700; line-height: 1.1;
    color: #1a1a1a;
    margin-bottom: 40px;
  }
  .headline span {
    color: #e91e8c;
  }
  .subtext {
    font-size: 22px; line-height: 1.7; color: #4a3040;
    max-width: 650px; font-weight: 300;
    margin-bottom: auto;
  }
  /* Product dots */
  .product-strip {
    display: flex; gap: 20px; margin-bottom: 60px;
  }
  .product-dot {
    width: 90px; height: 90px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; text-align: center; color: #fff;
    padding: 8px;
  }
  .product-dot:nth-child(1) { background: linear-gradient(135deg, #e91e8c, #c2185b); }
  .product-dot:nth-child(2) { background: linear-gradient(135deg, #f06292, #e91e8c); }
  .product-dot:nth-child(3) { background: linear-gradient(135deg, #f8b4c8, #f06292); }
  .product-dot:nth-child(4) { background: linear-gradient(135deg, #ffcdd2, #f8b4c8); color: #9a2060; }
  .product-dot:nth-child(5) { background: linear-gradient(135deg, #fff5f7, #ffcdd2); color: #9a2060; }
  /* CTA */
  .cta-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cta-btn {
    background: #e91e8c; color: white;
    font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600;
    padding: 20px 50px; border-radius: 50px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .tagline {
    font-family: 'Playfair Display', serif;
    font-size: 16px; color: #9a2060; font-style: italic;
    letter-spacing: 1px;
  }
  .free-ship {
    font-size: 14px; font-weight: 500; color: #e91e8c;
    letter-spacing: 1px; text-transform: uppercase;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="shimmer"></div>
  <div class="circle1"></div>
  <div class="circle2"></div>
  <div class="circle3"></div>
  <div class="content">
    <div class="logo-area">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <span class="logo-text">GLOWHAVEN</span>
    </div>
    <h1 class="headline">Your <span>Glass Skin</span> Era Starts Here</h1>
    <p class="subtext">
      Premium skincare tools & serums curated for the glass skin obsessed. Science-backed. Trend-approved.
    </p>
    <div class="product-strip">
      <div class="product-dot">LED Masks</div>
      <div class="product-dot">Serums</div>
      <div class="product-dot">Tools</div>
      <div class="product-dot">SPF</div>
      <div class="product-dot">Body</div>
    </div>
    <div class="cta-row">
      <div class="cta-btn">Shop Now</div>
      <div>
        <div class="tagline">Glass Skin Beauty</div>
        <div class="free-ship">Free shipping on $40+</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
