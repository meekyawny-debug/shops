<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Retargeting Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .ad {
    width: 1080px; height: 1350px;
    background: white;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  /* Split design */
  .left-panel {
    position: absolute; left: 0; top: 0; bottom: 0; width: 50%;
    background: linear-gradient(180deg, #fff5f7, #fce4ec);
    display: flex; flex-direction: column; justify-content: center;
    padding: 90px 50px 90px 70px;
  }
  .right-panel {
    position: absolute; right: 0; top: 0; bottom: 0; width: 50%;
    background: linear-gradient(135deg, #e91e8c, #c2185b);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 90px 70px;
  }
  /* Left content */
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 18px; font-weight: 600; letter-spacing: 4px;
    color: #1a1a1a; margin-bottom: 65px;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 56px; font-weight: 700; line-height: 1.15;
    color: #1a1a1a; margin-bottom: 24px;
  }
  .body-text {
    font-size: 18px; color: #6a4050; font-weight: 300;
    line-height: 1.7; margin-bottom: 50px;
  }
  .cta-btn {
    display: inline-block;
    background: #e91e8c; color: white;
    font-size: 15px; font-weight: 600;
    padding: 18px 40px; border-radius: 50px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  /* Right content — discount */
  .discount-circle {
    width: 300px; height: 300px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin-bottom: 50px;
  }
  .discount-pct {
    font-family: 'Playfair Display', serif;
    font-size: 96px; font-weight: 700; color: white;
    line-height: 1;
  }
  .discount-off {
    font-size: 22px; color: rgba(255,255,255,0.8);
    font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
  }
  .code-box {
    background: rgba(255,255,255,0.15);
    border: 2px dashed rgba(255,255,255,0.5);
    padding: 16px 40px; border-radius: 12px;
    text-align: center;
  }
  .code-label {
    font-size: 12px; color: rgba(255,255,255,0.6);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .code-text {
    font-size: 32px; font-weight: 700; color: white;
    letter-spacing: 6px;
  }
  .expiry {
    margin-top: 20px;
    font-size: 13px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="left-panel">
    <div class="logo">GLOWHAVEN</div>
    <h1 class="headline">Still thinking about it?</h1>
    <p class="body-text">
      Your glass skin routine is sitting in your cart, waiting for you.<br><br>
      Come back and your future skin will thank you.
    </p>
    <div class="cta-btn">Complete Purchase</div>
  </div>
  <div class="right-panel">
    <div class="discount-circle">
      <div class="discount-pct">10%</div>
      <div class="discount-off">Off</div>
    </div>
    <div class="code-box">
      <div class="code-label">Use Code</div>
      <div class="code-text">GLOW10</div>
    </div>
    <div class="expiry">First order only &bull; Limited time</div>
  </div>
</div>
</body>
</html>
