<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>GLOWHAVEN — Story Ad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .ad {
    width: 1080px; height: 1920px;
    background: linear-gradient(180deg, #fff5f7 0%, #fce4ec 30%, #f8b4c8 60%, #e91e8c 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  /* Decorative blobs */
  .blob1 {
    position: absolute; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
    top: 200px; right: -150px;
  }
  .blob2 {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
    top: 900px; left: -100px;
  }
  /* Product circles in middle */
  .product-circles {
    position: absolute; top: 580px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 700px;
  }
  .p-circle {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: white;
  }
  .p-circle .icon { font-size: 44px; margin-bottom: 10px; }
  .p-circle .name { font-size: 15px; font-weight: 600; }
  .p-circle .desc { font-size: 11px; opacity: 0.7; margin-top: 4px; }
  .pc1 { width: 220px; height: 220px; top: 0; left: 50%; transform: translateX(-50%); }
  .pc2 { width: 200px; height: 200px; top: 200px; left: 20px; }
  .pc3 { width: 200px; height: 200px; top: 200px; right: 20px; }
  .pc4 { width: 190px; height: 190px; top: 430px; left: 80px; }
  .pc5 { width: 190px; height: 190px; top: 430px; right: 80px; }
  .content {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    padding: 100px 70px 80px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 24px; font-weight: 600; letter-spacing: 6px;
    color: #1a1a1a; text-align: center;
    margin-bottom: 50px;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    font-size: 72px; font-weight: 700; line-height: 1.1;
    color: #1a1a1a; text-align: center;
  }
  .headline em { color: #e91e8c; font-style: normal; }
  .sub {
    font-size: 20px; color: #5a2040; text-align: center;
    margin-top: 16px; font-weight: 300;
  }
  .spacer { flex: 1; }
  .bottom-section { text-align: center; }
  .cta-btn {
    display: inline-block;
    background: white; color: #e91e8c;
    font-size: 18px; font-weight: 700;
    padding: 22px 60px; border-radius: 50px;
    letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    margin-bottom: 20px;
  }
  .swipe-hint {
    font-size: 14px; color: rgba(255,255,255,0.8);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .swipe-arrow {
    display: block; margin: 8px auto 0;
    font-size: 20px; color: rgba(255,255,255,0.8);
    animation: bounce 1.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(8px); }
  }
</style>
</head>
<body>
<div class="ad">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="product-circles">
    <div class="p-circle pc1">
      <div class="icon">&#x1F48E;</div>
      <div class="name">LED Mask</div>
      <div class="desc">Pro therapy</div>
    </div>
    <div class="p-circle pc2">
      <div class="icon">&#x1F9EA;</div>
      <div class="name">Snail Mucin</div>
      <div class="desc">Deep hydration</div>
    </div>
    <div class="p-circle pc3">
      <div class="icon">&#x2728;</div>
      <div class="name">Vitamin C</div>
      <div class="desc">Brightening</div>
    </div>
    <div class="p-circle pc4">
      <div class="icon">&#x2744;&#xFE0F;</div>
      <div class="name">Ice Roller</div>
      <div class="desc">De-puffing</div>
    </div>
    <div class="p-circle pc5">
      <div class="icon">&#x2600;&#xFE0F;</div>
      <div class="name">SPF 50+</div>
      <div class="desc">Glass skin finish</div>
    </div>
  </div>
  <div class="content">
    <div class="logo">GLOWHAVEN</div>
    <h1 class="headline">Your<br><em>Glow Up</em><br>Awaits</h1>
    <p class="sub">Skincare tools & serums that actually work</p>
    <div class="spacer"></div>
    <div class="bottom-section">
      <div class="cta-btn">Shop Now</div>
      <div class="swipe-hint">Swipe Up to Shop</div>
      <span class="swipe-arrow">&#x2303;</span>
    </div>
  </div>
</div>
</body>
</html>
