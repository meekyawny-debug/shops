<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NESTWELL — Product Spotlight</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: #faf8f5;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #2d3a2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }
  .post::before {
    content: '';
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(124, 154, 110, 0.06);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(232, 220, 200, 0.4);
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7c9a6e;
  }
  .spotlight-label {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #7c9a6e;
    margin-bottom: 35px;
    position: relative;
    z-index: 1;
  }
  .product-visual {
    width: 280px; height: 300px;
    border-radius: 30px;
    background: linear-gradient(150deg, #e8dcc8 0%, #d4c4a8 50%, #c9b896 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 70px rgba(45, 58, 42, 0.1);
  }
  /* Cloud humidifier CSS art */
  .cloud {
    position: relative;
    width: 120px; height: 60px;
    background: white;
    border-radius: 60px;
    margin-bottom: 10px;
  }
  .cloud::before {
    content: '';
    position: absolute;
    top: -30px; left: 25px;
    width: 55px; height: 55px;
    background: white;
    border-radius: 50%;
  }
  .cloud::after {
    content: '';
    position: absolute;
    top: -18px; right: 18px;
    width: 40px; height: 40px;
    background: white;
    border-radius: 50%;
  }
  .rain-drops {
    display: flex;
    gap: 15px;
    margin-top: 10px;
  }
  .drop {
    width: 8px; height: 16px;
    background: rgba(124, 154, 110, 0.4);
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
  }
  .drop:nth-child(2) { margin-top: 8px; opacity: 0.6; }
  .drop:nth-child(4) { margin-top: 5px; opacity: 0.7; }
  .product-name {
    font-family: 'DM Serif Display', serif;
    font-size: 60px;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
  }
  .product-sub {
    font-size: 20px;
    font-weight: 300;
    color: rgba(45, 58, 42, 0.55);
    text-align: center;
    margin-bottom: 45px;
    position: relative;
    z-index: 1;
  }
  .features {
    display: flex;
    gap: 30px;
    margin-bottom: 45px;
    position: relative;
    z-index: 1;
  }
  .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .feature-icon {
    width: 74px; height: 74px;
    border-radius: 20px;
    background: white;
    box-shadow: 0 6px 20px rgba(45, 58, 42, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border: 1px solid rgba(124, 154, 110, 0.1);
  }
  .feature span {
    font-size: 14px;
    font-weight: 500;
    color: rgba(45, 58, 42, 0.6);
    text-align: center;
  }
  .price {
    font-family: 'DM Serif Display', serif;
    font-size: 52px;
    color: #7c9a6e;
    margin-bottom: 40px;
    position: relative;
    z-index: 1;
  }
  .cta {
    background: #7c9a6e;
    color: white;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 22px 65px;
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(124, 154, 110, 0.25);
    position: relative;
    z-index: 1;
  }
  .leaf-deco {
    position: absolute;
    font-size: 40px;
    opacity: 0.12;
  }
  .leaf-1 { top: 150px; left: 80px; transform: rotate(-30deg); }
  .leaf-2 { bottom: 180px; right: 70px; transform: rotate(20deg); }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">NESTWELL</div>
  <div class="leaf-deco leaf-1">&#x1F33F;</div>
  <div class="leaf-deco leaf-2">&#x1F33F;</div>

  <div class="spotlight-label">Product Spotlight</div>

  <div class="product-visual">
    <div class="cloud"></div>
    <div class="rain-drops">
      <div class="drop"></div>
      <div class="drop"></div>
      <div class="drop"></div>
      <div class="drop"></div>
      <div class="drop"></div>
    </div>
  </div>

  <div class="product-name">Rain Cloud<br>Humidifier</div>
  <div class="product-sub">Bring the calm of a rainy day home</div>

  <div class="features">
    <div class="feature">
      <div class="feature-icon">&#x1F91B;</div>
      <span>Whisper<br>Quiet</span>
    </div>
    <div class="feature">
      <div class="feature-icon">&#x23F1;&#xFE0F;</div>
      <span>8-Hour<br>Runtime</span>
    </div>
    <div class="feature">
      <div class="feature-icon">&#x1F4A1;</div>
      <span>Ambient<br>Light</span>
    </div>
  </div>

  <div class="price">$29.99</div>
  <div class="cta">Shop Now</div>
</div>
</body>
</html>
