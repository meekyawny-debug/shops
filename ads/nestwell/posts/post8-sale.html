<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NESTWELL — Weekend Sale</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: #2d3a2a;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #faf8f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }
  /* Warm earthy glow */
  .post::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 154, 110, 0.1) 0%, transparent 60%);
  }
  .post::after {
    content: '';
    position: absolute;
    top: -100px; right: -100px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(232, 220, 200, 0.04);
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7c9a6e;
  }
  /* Warm frame */
  .frame {
    position: absolute;
    top: 35px; left: 35px; right: 35px; bottom: 35px;
    border: 1px solid rgba(124, 154, 110, 0.15);
    border-radius: 20px;
  }
  .sale-badge {
    background: #7c9a6e;
    color: white;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    padding: 16px 50px;
    border-radius: 50px;
    margin-bottom: 50px;
    box-shadow: 0 10px 40px rgba(124, 154, 110, 0.3);
    position: relative;
    z-index: 1;
  }
  .sale-text {
    font-family: 'DM Serif Display', serif;
    font-size: 140px;
    line-height: 1;
    text-align: center;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
    color: #faf8f5;
    text-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
  }
  .sale-text .percent {
    color: #7c9a6e;
  }
  .sale-sub {
    font-size: 30px;
    font-weight: 300;
    text-align: center;
    margin-bottom: 50px;
    opacity: 0.7;
    letter-spacing: 6px;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  .cozy-icons {
    display: flex;
    gap: 30px;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .cozy-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(124, 154, 110, 0.15);
    border: 1px solid rgba(124, 154, 110, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
  }
  .code-section {
    text-align: center;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
  }
  .code-label {
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 14px;
  }
  .code {
    display: inline-block;
    background: rgba(250, 248, 245, 0.1);
    border: 2px solid #7c9a6e;
    color: #7c9a6e;
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    letter-spacing: 8px;
    padding: 16px 50px;
    border-radius: 14px;
  }
  .cta {
    background: #faf8f5;
    color: #2d3a2a;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 24px 70px;
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }
  /* Corner leaf decorations */
  .corner-leaf {
    position: absolute;
    font-size: 50px;
    opacity: 0.08;
  }
  .cl-tl { top: 50px; left: 50px; transform: rotate(-45deg); }
  .cl-tr { top: 50px; right: 50px; transform: rotate(45deg); }
  .cl-bl { bottom: 50px; left: 50px; transform: rotate(-135deg); }
  .cl-br { bottom: 50px; right: 50px; transform: rotate(135deg); }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">NESTWELL</div>
  <div class="frame"></div>
  <div class="corner-leaf cl-tl">&#x1F33F;</div>
  <div class="corner-leaf cl-tr">&#x1F33F;</div>
  <div class="corner-leaf cl-bl">&#x1F33F;</div>
  <div class="corner-leaf cl-br">&#x1F33F;</div>

  <div class="sale-badge">&#x1F343; WEEKEND SALE</div>

  <div class="sale-text">25<span class="percent">%</span> OFF</div>
  <div class="sale-sub">Everything Cozy</div>

  <div class="cozy-icons">
    <div class="cozy-icon">&#x2601;&#xFE0F;</div>
    <div class="cozy-icon">&#x1F56F;&#xFE0F;</div>
    <div class="cozy-icon">&#x1FAB4;</div>
    <div class="cozy-icon">&#x1F4A1;</div>
  </div>

  <div class="code-section">
    <div class="code-label">Use code at checkout</div>
    <div class="code">COZY25</div>
  </div>

  <div class="cta">Shop the Sale</div>
</div>
</body>
</html>
