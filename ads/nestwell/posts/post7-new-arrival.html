<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NESTWELL — Back in Stock</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: #faf8f5;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #2d3a2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
  }
  .post::before {
    content: '';
    position: absolute;
    top: -150px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(124, 154, 110, 0.04);
  }
  .post::after {
    content: '';
    position: absolute;
    bottom: -100px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(232, 220, 200, 0.3);
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7c9a6e;
  }
  .stock-badge {
    background: #7c9a6e;
    color: white;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 14px 40px;
    border-radius: 50px;
    margin-bottom: 20px;
    box-shadow: 0 10px 35px rgba(124, 154, 110, 0.25);
    position: relative;
    z-index: 1;
  }
  .just-label {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: rgba(45, 58, 42, 0.5);
    font-style: italic;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .product-visual {
    width: 300px; height: 300px;
    border-radius: 50%;
    background: linear-gradient(145deg, #e8dcc8, #d4c4a8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 50px;
    position: relative;
    z-index: 1;
    box-shadow: 0 25px 70px rgba(45, 58, 42, 0.1);
  }
  .product-visual::after {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 2px dashed rgba(124, 154, 110, 0.2);
  }
  /* Cloud art inside circle */
  .mini-cloud {
    width: 100px; height: 50px;
    background: white;
    border-radius: 50px;
    position: relative;
    margin-bottom: 5px;
  }
  .mini-cloud::before {
    content: '';
    position: absolute;
    top: -22px; left: 18px;
    width: 42px; height: 42px;
    background: white;
    border-radius: 50%;
  }
  .mini-cloud::after {
    content: '';
    position: absolute;
    top: -12px; right: 14px;
    width: 30px; height: 30px;
    background: white;
    border-radius: 50%;
  }
  .mini-drops {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mini-drop {
    width: 5px; height: 10px;
    background: rgba(124, 154, 110, 0.4);
    border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
  }
  .mini-drop:nth-child(2) { margin-top: 5px; }
  .mini-drop:nth-child(4) { margin-top: 3px; }
  .product-name {
    font-family: 'DM Serif Display', serif;
    font-size: 58px;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
  }
  .product-name .accent { color: #7c9a6e; }
  .product-desc {
    font-size: 22px;
    font-weight: 300;
    color: rgba(45, 58, 42, 0.5);
    text-align: center;
    max-width: 650px;
    line-height: 1.6;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .urgency {
    font-size: 16px;
    font-weight: 500;
    color: #c0392b;
    margin-bottom: 45px;
    position: relative;
    z-index: 1;
    letter-spacing: 1px;
  }
  .cta {
    background: #7c9a6e;
    color: white;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 22px 60px;
    border-radius: 50px;
    box-shadow: 0 12px 40px rgba(124, 154, 110, 0.25);
    position: relative;
    z-index: 1;
  }
  /* Decorative leaves */
  .leaf-deco {
    position: absolute;
    font-size: 40px;
    opacity: 0.1;
  }
  .ld-1 { top: 160px; left: 100px; transform: rotate(-25deg); }
  .ld-2 { top: 240px; right: 80px; transform: rotate(15deg); }
  .ld-3 { bottom: 200px; left: 120px; transform: rotate(30deg); }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">NESTWELL</div>
  <div class="leaf-deco ld-1">&#x1F33F;</div>
  <div class="leaf-deco ld-2">&#x1F343;</div>
  <div class="leaf-deco ld-3">&#x1F33F;</div>

  <div class="stock-badge">BACK IN STOCK</div>
  <div class="just-label">Just Restocked</div>

  <div class="product-visual">
    <div class="mini-cloud"></div>
    <div class="mini-drops">
      <div class="mini-drop"></div>
      <div class="mini-drop"></div>
      <div class="mini-drop"></div>
      <div class="mini-drop"></div>
    </div>
  </div>

  <div class="product-name">Rain Cloud<br><span class="accent">Humidifier</span></div>
  <div class="product-desc">
    Your most-requested product is finally back. The calming rain cloud that sold out in 48 hours.
  </div>
  <div class="urgency">Limited quantity -- sells out fast</div>
  <div class="cta">Grab Yours Before It's Gone</div>
</div>
</body>
</html>
