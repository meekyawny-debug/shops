<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NESTWELL — Quote</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .post {
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, #e8dcc8 0%, #faf8f5 40%, #f0ece5 70%, #e8dcc8 100%);
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: #2d3a2a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px;
  }
  .brand-tag {
    position: absolute;
    top: 60px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #7c9a6e;
  }
  /* Decorative natural elements */
  .deco-ring-1 {
    position: absolute;
    top: 120px; left: 100px;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 1.5px solid rgba(124, 154, 110, 0.12);
  }
  .deco-ring-2 {
    position: absolute;
    bottom: 140px; right: 120px;
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 1.5px solid rgba(124, 154, 110, 0.1);
  }
  .deco-leaf-1 {
    position: absolute;
    top: 180px; right: 120px;
    font-size: 50px;
    opacity: 0.1;
    transform: rotate(25deg);
  }
  .deco-leaf-2 {
    position: absolute;
    bottom: 200px; left: 100px;
    font-size: 45px;
    opacity: 0.08;
    transform: rotate(-15deg);
  }
  .deco-line-top {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: rgba(124, 154, 110, 0.25);
  }
  .deco-line-bottom {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 2px;
    background: rgba(124, 154, 110, 0.25);
  }
  .home-icon {
    font-size: 60px;
    margin-bottom: 40px;
    opacity: 0.3;
  }
  .quote-mark {
    font-family: 'DM Serif Display', serif;
    font-size: 160px;
    color: rgba(124, 154, 110, 0.18);
    line-height: 0.5;
    margin-bottom: 30px;
  }
  .quote-text {
    font-family: 'DM Serif Display', serif;
    font-size: 62px;
    text-align: center;
    line-height: 1.3;
    color: #2d3a2a;
    max-width: 850px;
    position: relative;
    z-index: 1;
  }
  .quote-accent { color: #7c9a6e; }
  .divider {
    width: 60px;
    height: 3px;
    background: #7c9a6e;
    border-radius: 2px;
    margin: 45px 0 25px;
  }
  .attribution {
    font-size: 18px;
    font-weight: 400;
    color: rgba(45, 58, 42, 0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="post">
  <div class="brand-tag">NESTWELL</div>
  <div class="deco-ring-1"></div>
  <div class="deco-ring-2"></div>
  <div class="deco-leaf-1">&#x1F33F;</div>
  <div class="deco-leaf-2">&#x1F343;</div>
  <div class="deco-line-top"></div>
  <div class="deco-line-bottom"></div>

  <div class="home-icon">&#x1F3E1;</div>
  <div class="quote-mark">&ldquo;</div>
  <div class="quote-text">
    Home is not a place, it's a <span class="quote-accent">feeling</span>
  </div>
  <div class="divider"></div>
  <div class="attribution">@nestwell</div>
</div>
</body>
</html>
