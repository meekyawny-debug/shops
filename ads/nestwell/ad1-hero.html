<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>NESTWELL — Hero Ad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .ad {
    width: 1080px; height: 1350px;
    background: #f5f0ea;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
  }
  /* Organic shapes */
  .shape1 {
    position: absolute; width: 600px; height: 600px;
    border-radius: 60% 40% 50% 50%;
    background: linear-gradient(135deg, rgba(139,115,85,0.08), rgba(45,80,22,0.06));
    top: -100px; right: -150px;
    transform: rotate(-15deg);
  }
  .shape2 {
    position: absolute; width: 400px; height: 400px;
    border-radius: 50% 60% 40% 50%;
    background: linear-gradient(135deg, rgba(45,80,22,0.05), transparent);
    bottom: -50px; left: -80px;
    transform: rotate(20deg);
  }
  .shape3 {
    position: absolute; width: 250px; height: 250px;
    border-radius: 45% 55% 50% 50%;
    border: 1px solid rgba(139,115,85,0.1);
    top: 400px; right: 150px;
    transform: rotate(30deg);
  }
  /* Leaf accents */
  .leaf {
    position: absolute; width: 60px; height: 30px;
    border-radius: 0 50% 50% 0;
    background: rgba(45,80,22,0.08);
  }
  .leaf1 { top: 180px; right: 120px; transform: rotate(-30deg); }
  .leaf2 { bottom: 250px; right: 200px; transform: rotate(45deg); width: 40px; height: 20px; }
  .leaf3 { top: 600px; left: 100px; transform: rotate(-60deg); width: 50px; height: 25px; }
  .content {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column;
    padding: 100px 70px;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; letter-spacing: 5px;
    color: #8b7355; margin-bottom: 90px;
  }
  .headline {
    font-family: 'DM Serif Display', serif;
    font-size: 78px; line-height: 1.1;
    color: #2a2218;
    margin-bottom: 32px;
  }
  .headline em {
    color: #2d5016; font-style: normal;
  }
  .divider {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, #8b7355, #2d5016);
    border-radius: 2px; margin-bottom: 32px;
  }
  .subtext {
    font-size: 20px; color: #8b7355; font-weight: 300;
    line-height: 1.8; max-width: 580px;
    margin-bottom: auto;
  }
  /* Category tags */
  .categories {
    display: flex; gap: 14px; margin-bottom: 56px;
    flex-wrap: wrap;
  }
  .cat-tag {
    background: rgba(139,115,85,0.1);
    border: 1px solid rgba(139,115,85,0.2);
    color: #8b7355; font-size: 13px; font-weight: 500;
    padding: 10px 22px; border-radius: 8px;
    letter-spacing: 1px;
  }
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cta-btn {
    background: #2d5016; color: #f5f0ea;
    font-size: 16px; font-weight: 600;
    padding: 20px 50px; border-radius: 8px;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .tagline-block {
    text-align: right;
  }
  .tagline {
    font-family: 'DM Serif Display', serif;
    font-size: 18px; color: #8b7355;
    font-style: italic;
  }
  .shipping {
    font-size: 13px; color: #b8a080; margin-top: 6px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="shape1"></div>
  <div class="shape2"></div>
  <div class="shape3"></div>
  <div class="leaf leaf1"></div>
  <div class="leaf leaf2"></div>
  <div class="leaf leaf3"></div>
  <div class="content">
    <div class="logo">NESTWELL</div>
    <h1 class="headline">Make Your<br>Space Feel<br>Like a <em>Hug</em></h1>
    <div class="divider"></div>
    <p class="subtext">
      Curated home decor for people who believe your space should feel as good as it looks.
    </p>
    <div class="categories">
      <div class="cat-tag">Aromatherapy</div>
      <div class="cat-tag">Lighting</div>
      <div class="cat-tag">Textiles</div>
      <div class="cat-tag">Wall Decor</div>
      <div class="cat-tag">Organization</div>
    </div>
    <div class="bottom">
      <div class="cta-btn">Shop Collection</div>
      <div class="tagline-block">
        <div class="tagline">Cozy Home Aesthetic</div>
        <div class="shipping">Free shipping on $50+</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
